name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        run: python -m pip install -e ".[dev,build]"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

      - name: Build single-file Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipTests

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexUsageDashboard-windows-x64
          path: dist/CodexUsageDashboard.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows executable artifact
        uses: actions/download-artifact@v8
        with:
          name: CodexUsageDashboard-windows-x64
          path: release

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          executable="./release/CodexUsageDashboard.exe"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$executable" --clobber
          else
            gh release create "$tag" "$executable" --generate-notes --title "Codex Usage Dashboard $tag"
          fi
